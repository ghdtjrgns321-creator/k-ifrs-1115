[project]
name = "k-ifrs-1115-chatbot"
version = "0.1.0"
description = "K-IFRS 1115 전문 Q&A 챗봇 — 지식그래프 탐색 + PydanticAI 기반 회계기준서 검색·답변 시스템"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.129.2",
    "pydantic-ai>=0.1.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.2.1",
    "streamlit>=1.54.0",
    "uvicorn>=0.41.0",
    "beautifulsoup4>=4.14.3",
    "pymongo>=4.16.0",
    "httpx>=0.27.0",
    "cachetools>=5.0",
    "google-genai>=1.0.0",
]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]
preprocessing = [
    "beautifulsoup4>=4.14.3",
    "requests>=2.0",
]
